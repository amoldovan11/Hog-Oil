name: Deploy to GitHub Pages

# Builds and publishes the static HOG OIL site to GitHub Pages.
# Pages must be enabled once under Settings > Pages (Source: "GitHub Actions");
# after that, every push to the default branch deploys automatically.

on:
  push:
    branches: ["claude/jolly-hawking-mrggnp"]
  workflow_dispatch:

# Permissions the GITHUB_TOKEN needs to enable + deploy Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let in-progress runs finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The site lives at the repo root (index.html, css/, js/).
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
